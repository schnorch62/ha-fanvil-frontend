# Experimental same-origin reverse proxy. This is not yet a production configuration.
server {
    listen 8124;
    server_name _;
    client_max_body_size 32m;

    # The legacy bundle is not yet verified. Never silently serve a current Core
    # frontend or claim compatibility with Chromium 66.
    location = / {
        root /opt/fanvil;
        try_files /staging.html =404;
    }

    location /api/websocket {
        proxy_pass https://192.168.2.48:443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass https://192.168.2.48:443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
