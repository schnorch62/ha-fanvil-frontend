map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8124;
    server_name _;

    root /opt/fanvil;
    index index.html;
    client_max_body_size 32m;

    # Legacy frontend entry point
    location = / {
        try_files /index.html =404;
    }

    # Legacy frontend JavaScript bundles
    location /frontend_es5/ {
        try_files $uri =404;
    }

    location /frontend_latest/ {
        try_files $uri =404;
    }

    # Legacy frontend static resources
    location /static/ {
        try_files $uri =404;
    }

    # Home Assistant Core API, authentication,
    # WebSockets, WebRTC signaling and other endpoints
    location / {
        proxy_pass https://192.168.2.48:443;
        proxy_ssl_verify off;

        proxy_http_version 1.1;

        # Support WebSocket upgrades on any proxied endpoint
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve original request host
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections and streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Avoid buffering streaming responses
        proxy_buffering off;
    }
}

